server:
  port: 8083

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/auth/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: http://localhost:8080
              predicates:
                - Path=/auth/**
            - id: products
              uri: http://localhost:8081
              predicates:
                - Path=/products/**
            - id: reviews
              uri: http://localhost:8082
              predicates:
                - Path=/reviews/**
          default-filters:
            - AddResponseHeader=X-Gateway, SpringCloudGateway
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                rate-limiter: "#{@inMemoryRateLimiter}"

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 30s
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      serviceProxyCircuitBreaker:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 4
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      serviceRetry:
        baseConfig: default

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    org.springframework.cloud.gateway.filter.factory.RetryGatewayFilterFactory: TRACE
    io.github.resilience4j: DEBUG
    io.github.resilience4j.retry: DEBUG
    reactor.netty: DEBUG