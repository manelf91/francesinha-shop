services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  auth:
    image: maven:3.9.9-eclipse-temurin-24
    volumes:
      - ../services-auth:/app
      - ~/.m2:/root/.m2
    command: mvn spring-boot:run -Dspring-boot.run.profiles=test

  products:
    image: maven:3.9.9-eclipse-temurin-24
    volumes:
      - ../services-products:/app
      - ~/.m2:/root/.m2
    command: mvn spring-boot:run -Dspring-boot.run.profiles=test

  reviews:
    image: maven:3.9.9-eclipse-temurin-24
    volumes:
      - ../services-reviews:/app
      - ~/.m2:/root/.m2
    command: mvn spring-boot:run -Dspring-boot.run.profiles=test

  e2e-tests:
    image: maven:3.9.9-eclipse-temurin-24
    working_dir: /app
    volumes:
      - ../e2e-tests:/app
      - ~/.m2:/root/.m2
    environment:
      AUTH_ENDPOINT: http://auth:8080
      PRODUCT_ENDPOINT: http://products:8081
      REVIEW_ENDPOINT: http://reviews:8082
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_healthy
      products:
        condition: service_healthy
      reviews:
        condition: service_healthy
    command: mvn verify